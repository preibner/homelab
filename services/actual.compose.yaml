services:
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped
    expose:
      - "5006"
    volumes:
      - actual_data:/data
    mem_limit: 512m
    cpus: 1.0
    networks:
      - proxy

volumes:
  actual_data:

networks:
  proxy:
    external: true
