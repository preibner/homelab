services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    hostname: pihole
    restart: unless-stopped

    environment:
      TZ: ${TIMEZONE}
      FTLCONF_webserver_api_password: ${API_PASSWORD}

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"

    volumes:
      - etc-pihole:/etc/pihole
      - etc-dnsmasq.d:/etc/dnsmasq.d

    networks:
      - proxy

volumes:
  etc-pihole:
  etc-dnsmasq.d:

networks:
  proxy:
    external: true
